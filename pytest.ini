[pytest]
# The release suite. `tests/` is the gate: the submission contract, the output
# invariants, the deterministic kernel, the release gates and the privacy rules
# that shipping depends on.
#
# `tests/review/` holds the wider net grown during the release review: evidence
# assembly, the agent loop, vision/OCR, the TUI, the cache and the oracle
# comparisons, plus one table-driven file that pins every hole a reviewer found.
# It is runnable on demand and is not part of the default run.
testpaths = tests
norecursedirs = review __pycache__ .git build dist venv .venv node_modules
